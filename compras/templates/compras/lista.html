<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de compras</title>
<style>
    :root {
        --azul-profundo: #04293a;
        --azul-medio: #064663;
        --turquesa: #04a777;
        --espuma: #ecf9ff;
        --arena: #d6ce93;
        --texto: #04293a;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, var(--azul-profundo) 0%, var(--azul-medio) 45%, var(--turquesa) 100%);
        min-height: 100vh;
        color: var(--texto);
        display: flex;
        justify-content: center;
        padding: 40px 16px;
    }

    .contenedor {
        width: 100%;
        max-width: 640px;
        background: var(--espuma);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(4, 41, 58, 0.45);
        overflow: hidden;
    }

    .cabecera {
        background: var(--azul-profundo);
        padding: 28px 32px;
        position: relative;
    }

    .cabecera h1 {
        margin: 0;
        color: var(--espuma);
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .cabecera p {
        margin: 6px 0 0;
        color: var(--arena);
        font-size: 0.9rem;
    }

    .ola {
        display: block;
        width: 100%;
        height: 40px;
        margin-bottom: -4px;
    }

    .cuerpo {
        padding: 28px 32px 36px;
    }

    form.agregar {
        display: flex;
        gap: 10px;
        margin-bottom: 28px;
        flex-wrap: wrap;
    }

    form.agregar input {
        flex: 1;
        min-width: 120px;
        padding: 12px 14px;
        border: 2px solid var(--azul-medio);
        border-radius: 10px;
        font-size: 0.95rem;
        background: #ffffff;
        color: var(--texto);
    }

    form.agregar input:focus {
        outline: none;
        border-color: var(--turquesa);
    }

    form.agregar button {
        background: var(--turquesa);
        color: var(--espuma);
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    form.agregar button:hover {
        background: var(--azul-medio);
    }

    ul.productos {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    ul.productos li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #ffffff;
        border-left: 5px solid var(--turquesa);
        padding: 14px 16px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(4, 41, 58, 0.08);
    }

    ul.productos li span {
        font-weight: 500;
    }

    ul.productos li .cantidad {
        color: var(--azul-medio);
        font-weight: 600;
        margin-left: 8px;
    }

    .borrar-form button {
        background: transparent;
        border: 1px solid var(--azul-medio);
        color: var(--azul-medio);
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.2s ease;
    }

    .borrar-form button:hover {
        background: var(--azul-profundo);
        color: var(--espuma);
        border-color: var(--azul-profundo);
    }

    .vacio {
        text-align: center;
        color: var(--azul-medio);
        padding: 20px 0;
        font-style: italic;
    }
</style>
</head>
<body>
    <div class="contenedor">
        <div class="cabecera">
            <h1>Lista de compras</h1>
            <p>Registra lo que necesitas y llévate un control claro de tu inventario</p>
        </div>
        <svg class="ola" viewBox="0 0 1440 60" preserveAspectRatio="none">
            <path fill="#ecf9ff" d="M0,32 C240,64 480,0 720,16 C960,32 1200,64 1440,32 L1440,60 L0,60 Z"></path>
        </svg>

        <div class="cuerpo">
            <form class="agregar" method="post">
                {% csrf_token %}
                <input type="text" name="nombre" placeholder="Producto" required>
                <input type="number" name="cantidad" placeholder="Cantidad" min="1" required>
                <button type="submit">Agregar</button>
            </form>

            <ul class="productos">
                {% for producto in productos %}
                    <li>
                        <span>{{ producto.nombre }}<span class="cantidad">x{{ producto.cantidad }}</span></span>
                        <form class="borrar-form" method="post" action="{% url 'borrar_producto' producto.id %}">
                            {% csrf_token %}
                            <button type="submit">Eliminar</button>
                        </form>
                    </li>
                {% empty %}
                    <li class="vacio" style="border:none; box-shadow:none; justify-content:center;">
                        No hay productos todavía
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
